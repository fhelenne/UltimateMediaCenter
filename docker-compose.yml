name: ultimatemediacenter

services:
  app:
    build: .
    env_file: .env
    depends_on:
      - ntfy
    volumes:
      - app-data:/app/data
      - books-library:/books
    restart: unless-stopped

  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - DOCKER_MODS=linuxserver/mods:universal-calibre
    volumes:
      - calibre-web-config:/config
      - books-library:/books:ro
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "8000:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app
      - calibre-web
    restart: unless-stopped

  jellyfin:
    image: linuxserver/jellyfin:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    ports:
      - "8096:8096"
    volumes:
      - jellyfin-config:/config
      - sonarr-tv:/data/tv:ro
      - radarr-movies:/data/movies:ro
      - lidarr-music:/data/music:ro
      - books-library:/data/books:ro
    restart: unless-stopped

  ntfy:
    image: binwiederhier/ntfy:latest
    command: serve
    environment:
      - NTFY_BASE_URL=http://localhost
    ports:
      - "8080:80"
    volumes:
      - ntfy-data:/var/cache/ntfy
      - ntfy-etc:/etc/ntfy
    restart: unless-stopped

  sonarr:
    image: linuxserver/sonarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    ports:
      - "8989:8989"
    volumes:
      - sonarr-config:/config
      - sonarr-tv:/tv
      - sonarr-downloads:/downloads
    restart: unless-stopped

  radarr:
    image: linuxserver/radarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    ports:
      - "7878:7878"
    volumes:
      - radarr-config:/config
      - radarr-movies:/movies
      - radarr-downloads:/downloads
    restart: unless-stopped

  lidarr:
    image: linuxserver/lidarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    ports:
      - "8686:8686"
    volumes:
      - lidarr-config:/config
      - lidarr-music:/music
      - lidarr-downloads:/downloads
    restart: unless-stopped

  readarr:
    image: lscr.io/linuxserver/readarr:develop
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    ports:
      - "8787:8787"
    volumes:
      - readarr-config:/config
      - readarr-books:/books
      - readarr-downloads:/downloads
      - books-library:/books-library
    restart: unless-stopped

volumes:
  app-data:
  ntfy-data:
  ntfy-etc:
  sonarr-config:
  sonarr-tv:
    driver_opts:
      type: none
      o: bind
      device: ${USB_MOUNT}/tv
  sonarr-downloads:
  radarr-config:
  radarr-movies:
    driver_opts:
      type: none
      o: bind
      device: ${USB_MOUNT}/movies
  radarr-downloads:
  lidarr-config:
  lidarr-music:
    driver_opts:
      type: none
      o: bind
      device: ${USB_MOUNT}/music
  lidarr-downloads:
  readarr-config:
  readarr-books:
  readarr-downloads:
  books-library:
    driver_opts:
      type: none
      o: bind
      device: ${USB_MOUNT}/books-library
  calibre-web-config:
  caddy-data:
  jellyfin-config:
