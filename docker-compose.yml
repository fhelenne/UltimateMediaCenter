name: ultimatemediacenter

services:
  app:
    build: .
    # Volontairement PAS d'env_file: .env ici. HOST_LIBRARY_ROOT et
    # SHARES_MOUNT dans .env sont des chemins HÔTE, réservés à
    # l'interpolation ${...} de ce fichier compose (résolue côté hôte avant
    # même le démarrage des conteneurs) et à install.sh. env_file les
    # injecterait aussi dans l'environnement du conteneur app, où
    # pydantic-settings (case-insensitive) les ferait collisionner avec
    # d'éventuels champs Settings homonymes — cf finding C1. Seules les
    # variables réellement consommées par l'appli Python sont listées
    # explicitement ci-dessous, lues depuis .env via l'interpolation
    # compose normale.
    environment:
      - NTFY_URL=${NTFY_URL}
      - NTFY_TOPIC=${NTFY_TOPIC}
      - SONARR_URL=${SONARR_URL}
      - SONARR_API_KEY=${SONARR_API_KEY}
      - SONARR_SECRET=${SONARR_SECRET}
      - RADARR_URL=${RADARR_URL}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - RADARR_SECRET=${RADARR_SECRET}
      - LIDARR_URL=${LIDARR_URL}
      - LIDARR_API_KEY=${LIDARR_API_KEY}
      - LIDARR_SECRET=${LIDARR_SECRET}
      - READARR_URL=${READARR_URL}
      - READARR_API_KEY=${READARR_API_KEY}
      - READARR_SECRET=${READARR_SECRET}
      - JELLYFIN_URL=${JELLYFIN_URL}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - JELLYFIN_PUBLIC_URL=${JELLYFIN_PUBLIC_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - CACHE_TTL=${CACHE_TTL}
      - DB_PATH=${DB_PATH}
      - CALIBRE_LIBRARY_PATH=${CALIBRE_LIBRARY_PATH}
    depends_on:
      - ntfy
    cap_add:
      - SYS_ADMIN
    volumes:
      - app-data:/app/data
      - books-library:/books
      - type: bind
        source: ${HOST_LIBRARY_ROOT}
        target: /library-root
      - type: bind
        source: ${SHARES_MOUNT}
        target: /library-root/shares
        bind:
          propagation: shared
      # Bind-mount du .env réel (celui lu par install.sh et par
      # env_file/interpolation ci-dessus) dans le conteneur, au chemin que
      # pydantic-settings et export_import.ENV_PATH résolvent (CWD=/app,
      # cf Dockerfile WORKDIR). Sans ça, l'import de config (C3) réécrit un
      # .env dans le layer éphémère du conteneur, jeté au redémarrage.
      - type: bind
        source: ./.env
        target: /app/.env
    restart: unless-stopped

  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - DOCKER_MODS=linuxserver/mods:universal-calibre
    volumes:
      - calibre-web-config:/config
      - books-library:/books:ro
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "8000:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app
      - calibre-web
    restart: unless-stopped

  jellyfin:
    image: linuxserver/jellyfin:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    ports:
      - "8096:8096"
    volumes:
      - jellyfin-config:/config
      - sonarr-tv:/data/tv:ro
      - radarr-movies:/data/movies:ro
      - lidarr-music:/data/music:ro
      - books-library:/data/books:ro
      - type: bind
        source: ${HOST_LIBRARY_ROOT}
        target: /library-root
      - type: bind
        source: ${SHARES_MOUNT}
        target: /library-root/shares
        bind:
          propagation: rslave
    restart: unless-stopped

  ntfy:
    image: binwiederhier/ntfy:latest
    command: serve
    environment:
      - NTFY_BASE_URL=http://localhost
    ports:
      - "8080:80"
    volumes:
      - ntfy-data:/var/cache/ntfy
      - ntfy-etc:/etc/ntfy
    restart: unless-stopped

  sonarr:
    image: linuxserver/sonarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    ports:
      - "8989:8989"
    volumes:
      - sonarr-config:/config
      - sonarr-tv:/tv
      - sonarr-downloads:/downloads
      - type: bind
        source: ${HOST_LIBRARY_ROOT}
        target: /library-root
      - type: bind
        source: ${SHARES_MOUNT}
        target: /library-root/shares
        bind:
          propagation: rslave
    restart: unless-stopped

  radarr:
    image: linuxserver/radarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    ports:
      - "7878:7878"
    volumes:
      - radarr-config:/config
      - radarr-movies:/movies
      - radarr-downloads:/downloads
      - type: bind
        source: ${HOST_LIBRARY_ROOT}
        target: /library-root
      - type: bind
        source: ${SHARES_MOUNT}
        target: /library-root/shares
        bind:
          propagation: rslave
    restart: unless-stopped

  lidarr:
    image: linuxserver/lidarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    ports:
      - "8686:8686"
    volumes:
      - lidarr-config:/config
      - lidarr-music:/music
      - lidarr-downloads:/downloads
      - type: bind
        source: ${HOST_LIBRARY_ROOT}
        target: /library-root
      - type: bind
        source: ${SHARES_MOUNT}
        target: /library-root/shares
        bind:
          propagation: rslave
    restart: unless-stopped

  readarr:
    image: binhex/arch-readarr
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=000
      - TZ=Europe/Paris
    ports:
      - "8787:8787"
    volumes:
      - readarr-config:/config
      - readarr-books:/books
      - readarr-downloads:/downloads
      - books-library:/books-library
      - type: bind
        source: ${HOST_LIBRARY_ROOT}
        target: /library-root
      - type: bind
        source: ${SHARES_MOUNT}
        target: /library-root/shares
        bind:
          propagation: rslave
    restart: unless-stopped

volumes:
  app-data:
  ntfy-data:
  ntfy-etc:
  sonarr-config:
  sonarr-tv:
    driver_opts:
      type: none
      o: bind
      device: ${USB_MOUNT}/tv
  sonarr-downloads:
  radarr-config:
  radarr-movies:
    driver_opts:
      type: none
      o: bind
      device: ${USB_MOUNT}/movies
  radarr-downloads:
  lidarr-config:
  lidarr-music:
    driver_opts:
      type: none
      o: bind
      device: ${USB_MOUNT}/music
  lidarr-downloads:
  readarr-config:
  readarr-books:
  readarr-downloads:
  books-library:
    driver_opts:
      type: none
      o: bind
      device: ${USB_MOUNT}/books-library
  calibre-web-config:
  caddy-data:
  jellyfin-config:
