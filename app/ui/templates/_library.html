<div id="library-{{ arr }}">
  {% if error %}<p class="error">{{ error_message or "Erreur lors de l'opération sur le dossier." }}</p>{% endif %}
  <ul>
    {% for f in folders %}
    <li>
      {{ f.path }}
      <button hx-delete="/library/{{ arr }}/folders/{{ f.id }}" hx-target="#library-{{ arr }}" hx-swap="outerHTML">
        Retirer
      </button>
    </li>
    {% endfor %}
  </ul>
  <form hx-post="/library/{{ arr }}/folders" hx-target="#library-{{ arr }}" hx-swap="outerHTML">
    <input type="text" name="path" placeholder="{{ host_library_root }}/..." required>
    <small>Doit commencer par <code>{{ host_library_root }}</code> (ton dossier racine configuré).</small>
    <button type="submit">Ajouter</button>
  </form>
</div>
