<div id="library-{{ arr }}">
  {% if error %}<p class="error">{{ error_message or "Erreur lors de l'opération sur le dossier." }}</p>{% endif %}
  <ul>
    {% for f in folders %}
    <li>
      {{ f.path }}
      <button hx-delete="/library/{{ arr }}/folders/{{ f.id }}" hx-target="#library-{{ arr }}" hx-swap="outerHTML">
        Retirer
      </button>
    </li>
    {% endfor %}
  </ul>
  <div hx-get="/library/{{ arr }}/browse" hx-trigger="load" hx-swap="outerHTML" id="browse-{{ arr }}"></div>
</div>
